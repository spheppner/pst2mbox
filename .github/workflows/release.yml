name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[build]

      - name: Build Standalone Executable
        run: |
          python build_exe.py

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pst2mbox-windows-exe
          path: dist/pst2mbox.exe

  build-package:
    name: Build Python Package (sdist & wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip build

      - name: Build distributions
        run: |
          python -m build

      - name: Upload Distributions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pst2mbox-dist
          path: dist/*

  create-release:
    name: Publish GitHub Release
    needs: [ build-windows-exe, build-package ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: pst2mbox-windows-exe
          path: release-assets/

      - name: Download Distributions Artifact
        uses: actions/download-artifact@v4
        with:
          name: pst2mbox-dist
          path: release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
